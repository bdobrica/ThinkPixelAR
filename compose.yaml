name: thinkpixelar-development

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: thinkpixelar
      POSTGRES_PASSWORD: thinkpixelar-development-only
      POSTGRES_USER: thinkpixelar
    ports:
      - "127.0.0.1:${THINKPIXELAR_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkpixelar -d thinkpixelar"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
