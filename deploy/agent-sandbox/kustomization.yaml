apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream.yaml
images:
  - name: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    newTag: v1.0.0
    digest: sha256:bdde1a3150bd385f7318c974c1516e880b4f826b6b51a3e7f127c2f8c95b55cd
patches:
  - target:
      kind: Deployment
      name: agent-sandbox-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-sandbox-controller
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: agent-sandbox-controller
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: "1"
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
